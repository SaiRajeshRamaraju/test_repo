name: "Improvement Proposal"
description: "Suggest an improvement to any part of the Komura repository."
title: "[IMPROVEMENT] "
labels:
  - improvement

body:
  - type: markdown
    attributes:
      value: |
        Describe the improvement you would like to propose.
        Explain the current situation, the proposed change, and its expected benefits.
        Provide relevant details where applicable.

  - type: dropdown
    id: improvement_type
    attributes:
      label: Type of Improvement
      description: Select the category that best describes your proposal.
      multiple: false
      options:
        - "New Feature / Capability"
        - "Existing Feature Enhancement"
        - "Usability / Accessibility"
        - "Performance / Scalability"
        - "Reliability / Observability"
        - "Refactoring / Code Quality / Maintainability"
        - "Developer Experience / Tooling"
        - "Test Coverage / Quality Assurance"
        - "Documentation / Examples"
        - "Dependencies / Build / Deployment"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area to Improve
      description: Select all areas of the repository affected by this proposal.
      multiple: true
      options:
        - "Frontend Portal (frontend/komura-portal)"
        - "Backend Services (backend)"
        - "Agent SDK (agent-sdk)"
        - "Shared Libraries / Analyzers (libs)"
        - "Agents / Integrations / Examples (agents, examples)"
        - "Applications / Tools / Demos (apps, tools, demo)"
        - "Documentation / Onboarding"
        - "Testing / CI / Development Tooling"
        - "Deployment / Infrastructure"
        - "Repository-wide"
        - "Other / Unsure"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Opportunity
      description: Explain the problem or opportunity motivating this proposal.
      placeholder: |
        What is the current situation?
        Why is this improvement needed?
        Who would benefit from this change?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Improvement
      description: Describe the change you would like to introduce.
      placeholder: |
        What should be improved or added?
        How should the proposed change work?
        What benefits or outcomes are expected?
    validations:
      required: true

  - type: textarea
    id: frontend_visuals
    attributes:
      label: UI / Design References (Optional)
      description: Include mockups, screenshots, or design references if the proposal involves UI changes.
      placeholder: |
        Attach relevant mockups, wireframes, or screenshots.
        Explain the proposed UI changes and their benefits.
        Include before/after comparisons where useful.
        Do not include sensitive information.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (Optional)
      description: Describe other approaches considered, if any.
      placeholder: |
        What alternative approaches were considered?
        What are their advantages or disadvantages?
        Why is the proposed approach preferred?

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes / Compatibility (Optional)
      description: Include technical considerations or implementation suggestions, if known.
      placeholder: |
        Suggested implementation approach or steps.
        Dependencies, limitations, or potential risks.
        Compatibility concerns, API changes, or migrations.
        Testing and documentation considerations.
