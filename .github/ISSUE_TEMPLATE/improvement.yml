name: "Improvement Proposal"
description: Suggest an improvement to any part of the Komura repository.
title: "[IMPROVEMENT] "
labels: ["improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Give a brief overview of the improvement you'd like to see. Include any relevant details such as the current state, desired state and any alternatives to consider if applicable.
  - type: dropdown
    id: improvement_type
    attributes:
      label: Type of Improvement
      description: Select all categories that apply.
      multiple: false
      options:
        - New feature / Capability
        - Enhancement to an existing feature
        - Usability / Accessibility
        - Performance / Scalability
        - Reliability / Observability
        - Refactoring / Code quality / Maintainability
        - Developer experience / Tooling
        - Test coverage / Quality assurance
        - Documentation / Examples
        - Dependencies / Build / Deployment
        - Other
      validations:
        required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area to Improve
      description: Select all parts of the repository this proposal would improve.
      options:
        - label: Frontend Portal (frontend/komura-portal)
        - label: Backend Services (backend)
        - label: Agent SDK (agent-sdk)
        - label: Shared Libraries / Analyzers (libs)
        - label: Agents / Integrations / Examples (agents, examples)
        - label: Applications / Tools / Demos (apps, tools, demo)
        - label: Documentation / Onboarding
        - label: Testing / CI / Development Tooling
        - label: Deployment / Infrastructure
        - label: Repository-wide
        - label: Other / Unsure
      validations:
        required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Opportunity
      placeholder: |
        Explain why this improvement is useful and who would benefit.
        Describe the current approach and the opportunity to improve it or introduce a new capability.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Improvement
      placeholder: |
        Describe the capability, design, or workflow you propose.
        Explain what would change, its scope, and how it would improve the project.
    validations:
      required: true

  - type: textarea
    id: frontend_visuals
    attributes:
      label: Proposed UI / Design References (For Frontend Improvements)
      placeholder: |
        Drag and drop or paste mockups, wireframes, or annotated images showing the proposed UI.
        Explain what the design improves. Include a current screenshot for comparison where useful.
        Hide sensitive data. Leave blank if no UI change is proposed.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (Optional)
      placeholder: |
        Describe other approaches you considered and their tradeoffs.
        Explain why you prefer the proposed improvement, or leave blank if no alternatives were considered.
  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes / Compatibility (Optional)
      placeholder: |
        Share suggested implementation steps, dependencies, or risks if known.
        Note compatibility concerns, API changes, migrations, and testing or documentation updates.
        Leave blank if you do not have implementation details yet.
